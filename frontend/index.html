<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARSHIL'S AI — Calm Your Mind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            calm: {
              50:  '#f4f7f5',
              100: '#e3ece6',
              200: '#c5d9cc',
              300: '#9cbfaa',
              400: '#72a186',
              500: '#54856a',
              600: '#406a53',
              700: '#345544',
              800: '#1b2838',
              900: '#121b28',
              950: '#0b111a'
            },
            cream: '#f5f2eb'
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(24, 35, 50, 0.72); backdrop-filter: blur(16px); border: 1px solid rgba(114, 161, 134, 0.16); }
    .gradient-text { background: linear-gradient(135deg, #9cbfaa, #c5d9cc, #72a186); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    @keyframes typing-dot { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
    .typing-dot { animation: typing-dot 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .slide-up { animation: slideUp 0.5s ease; }
    @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(114, 161, 134, 0.3); border-radius: 3px; }
    .chat-msg a { color: #9cbfaa; text-decoration: underline; }
    .chat-msg strong { font-weight: 600; color: #f5f2eb; }
    .chat-msg p { margin-bottom: 0.5rem; }
    .chat-msg ul, .chat-msg ol { margin-left: 1.25rem; margin-bottom: 0.5rem; }
    .chat-msg li { margin-bottom: 0.25rem; }
    /* Light theme overrides */
    html:not(.dark) body { background: #f4f7f5; color: #1e293b; }
    html:not(.dark) .glass { background: rgba(255, 255, 255, 0.85); border-color: rgba(84, 133, 106, 0.18); }
    html:not(.dark) .chat-msg strong { color: #0f172a; }
    html:not(.dark) .text-cream { color: #1e293b; }
  </style>
</head>
<body class="bg-calm-950 text-cream min-h-screen">

<div id="app">

  <!-- ─── NAVBAR ──────────────────────────────────────────────────────── -->
  <nav class="sticky top-0 z-50 glass border-b border-calm-400/15">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('landing')">
        <div class="w-9 h-9 rounded-xl bg-calm-600/80 border border-calm-300/30 flex items-center justify-center shadow-md">
          <span class="text-lg">🌿</span>
        </div>
        <span class="font-bold text-base tracking-tight gradient-text">DARSHIL'S AI</span>
      </div>
      <div class="hidden md:flex items-center gap-5 text-sm font-medium text-slate-300">
        <button onclick="navigate('chat')" class="hover:text-calm-300 transition">Chat</button>
        <button onclick="navigate('clarity')" class="hover:text-calm-300 transition">Clarity Flow</button>
        <button onclick="navigate('breathe')" class="hover:text-calm-300 transition">Breathe</button>
        <button onclick="navigate('mood')" class="hover:text-calm-300 transition">Mood</button>
        <button onclick="navigate('growth')" class="hover:text-calm-300 transition">Habits</button>
        <button onclick="navigate('safety')" class="hover:text-calm-300 transition">Safety</button>
        <button onclick="navigate('about')" class="hover:text-calm-300 transition flex items-center gap-1"><span>✨</span> About AI</button>
      </div>
      <div class="flex items-center gap-2">
        <div id="ai-badge" class="hidden md:flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full border border-calm-400/20 bg-calm-900/60">
          <span id="ai-dot" class="w-2 h-2 rounded-full bg-yellow-500"></span>
          <span id="ai-label" class="text-slate-400">Checking…</span>
        </div>
        <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-calm-800/60 text-slate-400 hover:text-calm-300 transition" title="Toggle theme">
          <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646Z"/></svg>
        </button>
        <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg hover:bg-calm-800/60 text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden px-4 pb-3 space-y-1">
      <button onclick="navigate('chat');toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-calm-800/60">💬 Chat</button>
      <button onclick="navigate('clarity');toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-calm-800/60">✨ Clarity Flow (4 Steps)</button>
      <button onclick="navigate('breathe');toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-calm-800/60">🌬️ Breathe & Ground</button>
      <button onclick="navigate('mood');toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-calm-800/60">😊 Mood Check-In</button>
      <button onclick="navigate('growth');toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-calm-800/60">🌱 Habits</button>
      <button onclick="navigate('safety');toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-calm-800/60">🔒 Safety</button>
      <button onclick="navigate('about');toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-calm-800/60">✨ About AI</button>
      <button onclick="openUnfilteredMode();toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg text-sm text-cyan-300 font-semibold hover:bg-calm-800/60">🎙️ Unfiltered Mode</button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- PAGE: LANDING                                                       -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <section id="page-landing" class="page">
    <div class="min-h-[calc(100vh-56px)] flex flex-col items-center justify-center px-4 py-12 text-center">
      <div class="slide-up max-w-3xl">
        <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-calm-600/30 border border-calm-300/30 flex items-center justify-center shadow-lg">
          <span class="text-3xl">🌿</span>
        </div>
        <h1 class="text-3xl md:text-5xl font-bold leading-snug mb-4 text-cream">
          You don’t have to carry every thought alone
